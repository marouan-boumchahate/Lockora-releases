<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- LoQ Handwritten Capital Q Logo -->
  <defs>
    <!-- Background Sapphire to Cyber-Midnight Gradient -->
    <linearGradient id="sq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <!-- Q Letter Gradient: Pure Crisp White with subtle Ice Cyan Highlight -->
    <linearGradient id="q-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="q-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow and Glow for the Letter -->
    <filter id="q-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- LoQ Sapphire Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#sq-grad)" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="6" />
  <rect x="20" y="20" width="472" height="472" rx="132" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Ambient Radial Glow Behind the Q -->
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#q-core-glow)" />

